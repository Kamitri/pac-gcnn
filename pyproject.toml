[project]
name = "pac-gcnn"
version = "0.1.0"
description = "Forward prediction of the electronic properties of polycyclic aromatic compounds from a hexagonal grid representation and a group-equivariant convolutional network"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab",
    "matplotlib",
    "fastexcel",
    "kaleido",
    "loguru",
    "matplotlib",
    "networkx",
    "orjson",
    "pandas",
    "plotly",
    "polars",
    "rich",
    "scipy",
    "tensorboard",
    "tqdm",
    "torch",
    "jupyter",
    "scikit-learn",
    "rdkit",
    "typer",
    "cclib",
    "lightning",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
    "linkify-it-py",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib-mermaid",
]
dev = [
    "ruff",
    "pyrefly",
]
all = [
    "chemprop",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pac", "gcnn", "dataset", "benchmarks", "const.py", "utils.py"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132" },
]
cclib = { git = "https://github.com/cclib/cclib.git" }

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
